<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="b1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a101c"/>
  <circle cx="140" cy="80" r="420" fill="url(#b1)"/>
  <circle cx="1120" cy="560" r="460" fill="url(#b2)"/>

  <!-- brand row -->
  <rect x="72" y="64" width="44" height="44" rx="13" fill="url(#mark)"/>
  <text x="134" y="96" font-family="Avenir Next, Helvetica Neue, sans-serif" font-weight="600" font-size="26" fill="#94a3b8">Catalog · sprint protocol · live board</text>
  <rect x="860" y="62" width="268" height="48" rx="24" fill="#14b8a6" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.35"/>
  <circle cx="886" cy="86" r="5" fill="#2dd4bf"/>
  <text x="902" y="93" font-family="Menlo, monospace" font-weight="700" font-size="19" letter-spacing="1.5" fill="#2dd4bf">V1.0 · JULY 2026</text>

  <!-- title -->
  <text x="72" y="230" font-family="Avenir Next, Helvetica Neue, sans-serif" font-weight="800" font-size="70" letter-spacing="-1.5" fill="#f1f5f9">Open Physics Problems Map</text>
  <rect x="76" y="262" width="180" height="6" rx="3" fill="url(#accent)"/>
  <text x="72" y="326" font-family="Avenir Next, Helvetica Neue, sans-serif" font-weight="500" font-size="36" fill="#cbd5e1">112 open problems, tagged for checkable progress</text>

  <!-- stat tiles -->
  <g font-family="Avenir Next, Helvetica Neue, sans-serif">
    <rect x="72" y="374" width="246" height="112" rx="18" fill="#151d2e" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="2"/>
    <text x="96" y="432" font-family="Menlo, monospace" font-weight="700" font-size="42" fill="#2dd4bf">13</text>
    <text x="96" y="466" font-size="22" fill="#94a3b8">10-day sprints</text>

    <rect x="338" y="374" width="246" height="112" rx="18" fill="#151d2e" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <text x="362" y="432" font-family="Menlo, monospace" font-weight="700" font-size="42" fill="#fbbf24">15</text>
    <text x="362" y="466" font-size="22" fill="#94a3b8">stretch goals</text>

    <rect x="604" y="374" width="246" height="112" rx="18" fill="#151d2e" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <text x="628" y="432" font-family="Menlo, monospace" font-weight="700" font-size="42" fill="#60a5fa">48</text>
    <text x="628" y="466" font-size="22" fill="#94a3b8">multi-sprint</text>

    <rect x="870" y="374" width="258" height="112" rx="18" fill="#151d2e" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <text x="894" y="432" font-family="Menlo, monospace" font-weight="700" font-size="42" fill="#fb7185">36</text>
    <text x="894" y="466" font-size="22" fill="#94a3b8">not agentic alone</text>
  </g>

  <!-- byline -->
  <line x1="72" y1="530" x2="1128" y2="530" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
  <text x="72" y="576" font-family="Avenir Next, Helvetica Neue, sans-serif" font-weight="700" font-size="30" fill="#f1f5f9">Yossi Eliaz</text>
  <text x="1128" y="574" text-anchor="end" font-family="Menlo, monospace" font-size="21" fill="#94a3b8">zozo123.github.io/open-physics-problems</text>
</svg>
